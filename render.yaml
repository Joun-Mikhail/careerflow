# Render Blueprint — one-click deploy for CareerFlow.
# https://render.com/docs/blueprint-spec
#
# Provisions:
#   1. The FastAPI backend (Docker, runs migrations + seeds demo data on first boot)
#   2. The React frontend (static site, points at the backend URL)
#
# The database is NOT provisioned here; set DATABASE_URL yourself (see below).
#
# Use the "Deploy to Render" button in the README, or `render blueprint launch`.
services:
  - type: web
    name: careerflow-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Externally managed on purpose. Render's free PostgreSQL is deleted 30
      # days after it is created: the database provisioned on 2026-07-27 was
      # gone by 2026-08-26, which took the API down with it and is not
      # something a redeploy can fix. Point this at a Postgres that outlives a
      # month (Supabase, Neon, or a paid Render instance) and set it in the
      # dashboard. Declaring it `sync: false` also stops a blueprint sync from
      # overwriting the value with a regenerated free-database URL.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CAREERFLOW_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      # Browser origins allowed to call the API. This replaces the application
      # defaults wholesale, so the Capacitor WebView origins used by the mobile
      # builds have to be listed alongside the deployed web frontend.
      - key: CORS_ORIGINS
        value: https://careerflow2.vercel.app,https://frontend-jade-two-zfchqjb5ws.vercel.app,https://localhost,capacitor://localhost,ionic://localhost
      - key: PORT
        value: "8000"

  - type: web
    name: careerflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # set to https://<careerflow-api>.onrender.com/api/v1
